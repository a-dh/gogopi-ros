[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gogopi-sdk"
version = "0.3.0"
description = "GoGoPi robot hardware SDK for ROS2 Jazzy"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "GoGoPi Team"}]
keywords = ["robotics", "raspberry-pi", "gogopi", "ros2"]

dependencies = [
    "pigpio",
    "smbus2",
    "adafruit-blinka",
    "adafruit-circuitpython-mlx90640",
    "rpi-led-proxy @ git+ssh://git@gratzi:2222/albertd/rpi_ws281x_proxy",
]

[project.optional-dependencies]
dev = ["pytest", "black", "flake8"]

[tool.setuptools.packages.find]
where = ["."]
include = ["HiwonderSDK*"]

[tool.black]
line-length = 100
